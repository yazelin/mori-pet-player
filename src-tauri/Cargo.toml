[package]
name = "mori-pet-player"
version = "0.2.1"
description = "A small desktop companion for Mori character packs"
authors = ["Mori"]
edition = "2021"

[lib]
name = "mori_pet_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
